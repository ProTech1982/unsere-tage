name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signaturschlüssel bereitstellen
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Ohne festen Schlüssel lässt sich kein Update über eine bestehende
          # Installation legen. Deshalb bricht der Build bei jedem Fehler ab,
          # statt still eine Debug-APK zu bauen.
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signatur-Secrets fehlen (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)."
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 --decode > "$KS"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ist kein gültiges Base64."
            exit 1
          fi
          if ! keytool -J-Duser.language=en -list -keystore "$KS" -storepass "$KEY_PASS" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            cat "$RUNNER_TEMP/ks.txt"
            echo "::error::Keystore nicht lesbar - ANDROID_KEYSTORE_PASSWORD passt nicht."
            exit 1
          fi
          if ! grep -qi "^$KEY_ALIAS,.*PrivateKeyEntry" "$RUNNER_TEMP/ks.txt"; then
            echo "Gefundene Einträge:"
            grep -i "PrivateKeyEntry" "$RUNNER_TEMP/ks.txt" | cut -d, -f1 || true
            echo "::error::ANDROID_KEY_ALIAS passt zu keinem Schlüssel im Keystore."
            exit 1
          fi
          echo "Keystore in Ordnung, Alias: $KEY_ALIAS"
          {
            echo "ANDROID_KEYSTORE_FILE=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Layouts pruefen
        run: python3 tools/pruefe-layouts.py

      - name: APK bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/UnsereTage.apk
          version=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Betreffzeile des letzten Commits als Aenderungstext, ohne Anhaenge
          # wie Co-Authored-By.
          changes=$(git log -1 --pretty=%s)
          echo "changes=$changes" >> "$GITHUB_OUTPUT"

      - name: Als Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Unsere Tage ${{ steps.apk.outputs.version }} (Build ${{ github.run_number }})
          body: |
            Version ${{ steps.apk.outputs.version }}, Build ${{ github.run_number }}.

            Aenderungen in diesem Build:
            ${{ steps.apk.outputs.changes }}

            Unten auf **UnsereTage.apk** tippen, herunterladen und oeffnen.
          files: out/UnsereTage.apk

      - name: Auch als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: UnsereTage-APK
          path: out/UnsereTage.apk
